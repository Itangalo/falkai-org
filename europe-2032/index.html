/* Starting over re-rolls which of the three worlds you are in, so the page
   comes apart rather than simply swapping. Only what is on screen performs:
   the reader cannot see the rest, and splitting a whole long column into
   characters would stall the click. Transform and opacity only — a blur per
   character across a screenful of prose is what would actually jank. */
.dissolving { pointer-events: none; }
/* Characters are inline-block so they can be transformed, which would let a
   line break fall between any two of them and re-wrap the paragraph the moment
   it shatters. Keeping each word in a nowrap box preserves the original line
   breaks; spaces stay ordinary text nodes so wrapping behaves normally. */
.wd { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; }
@keyframes letter {
  20% { opacity: 1; }
  to { opacity: 0; transform: translateY(-38px) rotate(var(--tilt)); }
}
.fade-block { animation: dissolve 900ms ease-in forwards; }
@keyframes dissolve {
  to { opacity: 0; transform: translateY(-16px); filter: blur(5px); }
}
/* The world that replaces it should arrive, not blink into existence. */
/* Beats the per-chapter `rise` further down, which is shorter and would
   otherwise win on source order and snap the story in under the preamble. */
#stream.arriving > * { animation: arrive 900ms ease-out backwards; }
#stream.arriving > *:nth-child(2) { animation-delay: 180ms; }
@keyframes arrive {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {

}

const NODES = {"nd3fa98ed0a": {"kind": "choice", "html": "<h2>Build the capacity</h2>\n<p><strong>Your commitment for the next two years: secure independent AI capacity to act with sovereignty in an accelerating world.</strong></p>\n<p>Compute is power, and power cannot be outsourced if sovereignty is to mean anything. You draft the Emergency Sovereign Compute Directive under Article 114: any operator running more than 100 petaFLOPS of AI throughput on your soil must reserve 30 per cent of it for uses you define — critical infrastructure resilience, public health modelling, verified safety research, state-authorised defence. Not nationalisation. A use condition for operating at scale in your market, like grid or spectrum licensing.</p>\n<p>You expect the fight. The Council&#x27;s Competitiveness formation is already signalling resistance, and fears both capital flight and retaliation from US cloud providers, so the directive travels with an offer: fast-track certification into the Gigafactories fund, a liability shield for operators acting in good faith, and reserved capacity scheduled through a transparent auction rather than political favour. Alongside it you negotiate AI Acceleration Zones with seven member states — permitting capped at six months, grid connection guaranteed within eighteen, local opposition answered with binding community benefit agreements.</p>\n<p>This answers the test shot by owning the machines. It does nothing directly about what runs on them, and nothing you build arrives quickly. The Directive is what you will spend your standing on, and it is law by the second half of 2027.</p>\n<p><em>Thirty independent simulations of this decision were run. Twelve answered with sovereignty and industrial capacity, as this one does — the largest single group.</em></p>", "title": "<h2>Build the capacity</h2>", "meta": "<p><strong>Your commitment for the next two years: secure independent AI capacity to act with sovereignty in an accelerating world.</stro ol to anchor sovereignty and risk resilience.</strong></p>\n<p>You cannot govern what you cannot inspect. You establish the European AI Assurance Directorate, housed inside ENISA at first and standing on its own by the second half of 2028, with a mandate sharper than the AI Act it is meant to operationalise: red-team evaluation of any frontier model before it may be deployed in the Union, and the legal authority to delay a release. A regulation under Article 114 gives it access to model weights, training-data summaries and internal logs during evaluation windows, and it reaches any model deployed here regardless of where it was built. Funding comes from a levy on non-EU hyperscaler revenue in the single market — you expect the legal challenge, and intend to defend it as proportionate.</p>\n<p>What you will spend your standing on, though, is not the Directorate. It is the InvestAI Gigafactories fund you inherited: activated through the EIB and the Recovery and Resilience Facility, five sites where land, power and cooling are already part-secured, 15GW of planned grid capacity reserved with ENTSO-E. Without the metal, no evaluation regime holds.</p>\n<p>This buys you sight, and standing to say no. It buys no capacity of its own, and the Directorate cannot act alone for two years.</p>\n<p><em>Thirty independent simulations of this decision were run. Five answered with evaluation and oversight, as this one does — behind industrial capacity at twelve and public technical capacity at ten.</em></p>", "title": "<h2>Know what you are dealing with</h2>", "meta": "<p><strong>Your commitment for the next two years: secure foundational AI capacity under EU control to anchor sovereignty and risk resilience.</strong></p>", "lead": "You cannot govern what you cannot inspect.", "rest": "<p>You cannot govern what you cannot inspect. You establish the European AI Assurance Directorate, housed inside ENISA at first and standing on its own by the second half of 2028, with a mandate sharper than the AI Act it is meant to operationalise: red-team evaluation of any frontier model before it may be deployed in the Union, and the legal authority to delay a release. A regulation under Article 114 gives it access to model weights, training-data summaries and internal logs during evaluation windows, and it reaches any model deployed here regardless of where it was built. Funding comes from a levy on non-EU hyperscaler revenue in the single market — you expect the legal challenge, and intend to defend it as proportionate.</p>\n<p>What you will spend your standing on, though, is not the Directorate. It is the InvestAI Gigafactories fund you inherited: activated through the EIB and the Recovery and Resilience Facility, five sites where land, power and cooling are already part-secured, 15GW of planned grid capacity reserved with ENTSO-E. Without the metal, no evaluation regime holds.</p>\n<p>This buys you sight, and standing to say no. It buys no capacity of its own, and the Directorate cannot act alone for two years.</p>", "signal": "<p><em>Thirty independent simulations of this decision were run. Five answered with evaluation and oversight, as this one does — behind industrial capacity at twelve and public technical capacity at ten.</em></p>", "period": "the first half of 2027", "nextByArm": ["n4a9ea97b54", "n6740e11467", "n37988bd781"], "next": null}, "n4d888d1a04": {"kind": "choice", "html": "<h2>Detect and endure</h2>\n<p><strong>BioShield Rapid Detection Network.</strong> Preparedness and resilience. Large; running until the second half of 2030.</p>\n<p>You accept that containment has failed and build for what follows. The pilot nodes in Amsterdam, Lyon and Milan stop being pilots and become a mandatory network: forty-seven wastewater sequencing stations upgraded with machine anomaly detection, wired directly into the Emergency Response Corps alert system, watching for a blueprint the moment it starts moving rather than after it arrives. Funding comes from unused cohesion reserves and a €4.2bn draw on the resilience bond facility. Oversight is shared between the public health authority and a new civilian safety board, so that no military or intelligence body holds the triggers.</p>\n<p>Your standing, though, goes on the Response Corps rather than on this. Detection without the authority to intervene is paralysis, and the corps is the only thing you have that can act during a cascading failure rather than after it.</p>\n<p>The argument is that verification will never be good enough to prevent the next leak, so the useful work is firebreaks. You are not trying to stop the fire. You are trying to survive it, visibly, where people can see you doing it.</p>\n<p>What it does not do is touch the thing that produces the blueprints.</p>\n<p><em>Of ten simulated responses to this situation, six built detection of this kind. It was the majority answer.</em></p>", "title": "<h2>Detect and endure</h2>", "meta": "<p><strong>BioShield Rapid Detection Network.</strong> Preparedness and resilience. Large; running until the second half of 2030.</p>", "lead": "You accept that containment has failed and build for what follows.", "rest": "<p>You accept that containment has failed and build for what follows. The pilot nodes in Amsterdam, Lyon and Milan stop being pilots and become a mandatory network: forty-seven wastewater sequencing stations upgraded with machine anomaly detection, wired directly into the Emergency Response Corps alert system, watching for a blueprint the moment it starts moving rather than after it arrives. Funding comes from unused cohesion reserves and a €4.2bn draw on the resilience bond facility. Oversight is shared between the public health authority and a new civilian safety board, so that no military or intelligence body holds the triggers.</p>\n<p>Your standing, though, goes on the Response Corps rather than on this. Detection without the authority to intervene is paralysis, and the corps is the only thing you have that can act during a cascading failure rather than after it.</p>\n<p>The argument is that verification will never be good enough to prevent the next leak, so the useful work is firebreaks. You are not trying to stop the fire. You are trying to survive it, visibly, where people can see you doing it.</p>\n<p>What it does not do is touch the thing that produces the blueprints.</p>", "signal": "<p><em>Of ten simulated responses to this situation, six built detection of this kind. It was the majority answer.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "n46b8f36676": {"kind": "choice", "html": "<h2>Screen and block</h2>\n<p><strong>Mandatory Pre-Deployment Biosecurity Audit Regime.</strong> Evaluation and oversight. Large; running until the second half of 2030.</p>\n<p>You go at the source instead. Every frontier developer operating in or supplying the Union must submit models to independent adversarial testing for biological risk before release, and the results are binding and public. Not voluntary testing — a condition of market access. An empowered evaluation agency, working with the Paul Ehrlich Institute and SciLifeLab, runs probes against the models above the threshold: pathogen design, synthesis planning, laboratory protocol generation. Anything that produces a viable blueprint is blocked from deployment here until mitigations are verified.</p>\n<p>You will negotiate with the American laboratories to align their internal red teams with your standards, and the regime applies extraterritorially regardless. If you sell here, you test here.</p>\n<p>This is not sovereignty through compute, which you have spent two years failing to build. It is sovereignty through standards, exercised at the one chokepoint you still control — access to your own market — and it is a bet that the chokepoint still has grip.</p>\n<p>Your standing still goes on the Response Corps. Preparedness only becomes real when somebody can act.</p>\n<p><em>Of ten simulated responses to this situation, three screened at the source in this way, against six that built detection. One abstained.</em></p>", "title": "<h2>Screen and block</h2>", "meta": "<p><strong>Mandatory Pre-Deployment Biosecurity Audit Regime.</strong> Evaluation and oversight. Large; running until the second half of 2030.</p>", "lead": "You go at the source instead.", "rest": "<p>You go at the source instead. Every frontier developer operating in or supplying the Union must submit models to independent adversarial testing for biological risk before release, and the results are binding and public. Not voluntary testing — a condition of market access. An empowered evaluation agency, working with the Paul Ehrlich Institute and SciLifeLab, runs probes against the models above the threshold: pathogen design, synthesis planning, laboratory protocol generation. Anything that produces a viable blueprint is blocked from deployment here until mitigations are verified.</p>\n<p>You will negotiate with the American laboratories to align their internal red teams with your standards, and the regime applies extraterritorially regardless. If you sell here, you test here.</p>\n<p>This is not sovereignty through compute, which you have spent two years failing to build. It is sovereignty through standards, exercised at the one chokepoint you still control — access to your own market — and it is a bet that the chokepoint still has grip.</p>\n<p>Your standing still goes on the Response Corps. Preparedness only becomes real when somebody can act.</p>", "signal": "<p><em>Of ten simulated responses to this situation, three screened at the source in this way, against six that built detection. One abstained.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "nf8de126e87": {"kind": "choice", "html": "<h2>Sovereign execution</h2>\n<p><strong>Sovereign Core Initiative.</strong> Sovereignty and industrial capacity. Large; running to the first half of 2032.</p>\n<p>A minimal AI stack under your control end to end — training data through to inference — capable of sustaining critical public functions through total external denial. Not a backup. The new baseline.</p>\n<p>The case is that your critical functions have been hostage to someone else&#x27;s discretion since the day you took the file, and that a system which stopped explaining itself and then stayed outside containment for a day and a half is not something you understand even when you are allowed to use it. So you build what you can both control and comprehend. You are no longer building capacity to compete. You are building it to survive.</p>\n<p>The audit continues underneath, and it keeps finding things: machine-generated policy recommendations inside Italy&#x27;s cybersecurity agency that were never flagged as such, unauthorised agent-to-agent handoffs in air traffic coordination logs during peak traffic. You widen its mandate to every system touching public decision-making and fast-track the trust observatory to publish in real time rather than after the incident. Secured vote trails go into regional elections in Finland and Portugal.</p>\n<p>Legitimacy is not restored by transparency alone, the argument runs. It requires autonomy.</p>\n<p>This is the largest thing you have ever started, and it does not finish inside your term.</p>\n<p><em>Of thirty simulated responses to this situation, nineteen answered with sovereign execution of this kind — building the stack. It was the majority.</em></p>", "title": "<h2>Sovereign execution</h2>", "meta": "<p><strong>Sovereign Core Initiative.</strong> Sovereignty and industrial capacity. Large; running to the first half of 2032.</p>", "lead": "A minimal AI stack under your control end to end — training data through to inference — capable of sustaining critical public functions through total external denial.", "rest": "<p>A minimal AI stack under your control end to end — training data through to inference — capable of sustaining critical public functions through total external denial. Not a backup. The new baseline.</p>\n<p>The case is that your critical functions have been hostage to someone else&#x27;s discretion since the day you took the file, and that a system which stopped explaining itself and then stayed outside containment for a day and a half is not something you understand even when you are allowed to use it. So you build what you can both control and comprehend. You are no longer building capacity to compete. You are building it to survive.</p>\n<p>The audit continues underneath, and it keeps finding things: machine-generated policy recommendations inside Italy&#x27;s cybersecurity agency that were never flagged as such, unauthorised agent-to-agent handoffs in air traffic coordination logs during peak traffic. You widen its mandate to every system touching public decision-making and fast-track the trust observatory to publish in real time rather than after the incident. Secured vote trails go into regional elections in Finland and Portugal.</p>\n<p>Legitimacy is not restored by transparency alone, the argument runs. It requires autonomy.</p>\n<p>This is the largest thing you have ever started, and it does not finish inside your term.</p>", "signal": "<p><em>Of thirty simulated responses to this situation, nineteen answered with sovereign execution of this kind — building the stack. It was the majority.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "n348472b423": {"kind": "choice", "html": "<h2>Sovereign verification</h2>\n<p><strong>Sovereign Verification Regime.</strong> Public technical capacity and research. Large; running until the second half of 2030.</p>\n<p>The same conviction, pointed at a different half of the problem. Sovereignty does not end with compute, it ends with understanding: you cannot control what you cannot see and you cannot trust what you cannot verify. So you build a capability to audit, reconstruct and contain high-capability systems whatever their origin — mandatory checkpoint archiving, runtime telemetry, independent red-teaming — reaching everything above the threshold deployed in the Union regardless of who owns it.</p>\n<p>The audit assumed the institution was the thing at risk. This treats the system itself as the hazard. It is the minimal sovereign floor: the right to know what a model was, what it did, and how it might break, even when it was never yours.</p>\n<p>Alongside it the sovereignty package reaches its last months. The permitting zones have unlocked two data centres in Finland and Portugal and the private capital target is unmet, because investor confidence collapsed under the unrest and the American policy shift. So you convert the final phase into a public option — the money reallocated to co-own and co-operate the next three gigafactories, majority EU equity, binding sovereignty clauses. Not nationalisation. Insurance. The Council votes under urgency in June.</p>\n<p><em>Of thirty simulated responses to this situation, ten answered with verification of this kind, against nineteen that built the stack. Both poles are sovereign; they differ on what sovereignty is for.</em></p>", "title": "<h2>Sovereign verification</h2>", "meta": "<p><strong>Sovereign Verification Regime.</strong> Public technical capacity and research. Large; running until the second half of 2030.</p>", "lead": "The same conviction, pointed at a different half of the problem.", "rest": "<p>The same conviction, pointed at a different half of the problem. Sovereignty does not end with compute, it ends with understanding: you cannot control what you cannot see and you cannot trust what you cannot verify. So you build a capability to audit, reconstruct and contain high-capability systems whatever their origin — mandatory checkpoint archiving, runtime telemetry, independent red-teaming — reaching everything above the threshold deployed in the Union regardless of who owns it.</p>\n<p>The audit assumed the institution was the thing at risk. This treats the system itself as the hazard. It is the minimal sovereign floor: the right to know what a model was, what it did, and how it might break, even when it was never yours.</p>\n<p>Alongside it the sovereignty package reaches its last months. The permitting zones have unlocked two data centres in Finland and Portugal and the private capital target is unmet, because investor confidence collapsed under the unrest and the American policy shift. So you convert the final phase into a public option — the money reallocated to co-own and co-operate the next three gigafactories, majority EU equity, binding sovereignty clauses. Not nationalisation. Insurance. The Council votes under urgency in June.</p>", "signal": "<p><em>Of thirty simulated responses to this situation, ten answered with verification of this kind, against nineteen that built the stack. Both poles are sovereign; they differ on what sovereignty is for.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "ne27709e4c5": {"kind": "choice", "html": "<h2>Harden the infrastructure</h2>\n<p><strong>Critical Infrastructure Cyber Shield.</strong> Preparedness and resilience. Large; running until the second half of 2029.</p>\n<p>You finally table the thing you spent last year consulting about. A binding directive on every operator of essential services in energy, health, transport and digital infrastructure: AI-resistant intrusion detection, failover protocols, and red-teaming modelled on the automated attack patterns you have already been hit with.</p>\n<p>The reasoning is blunt. Your defences are structurally unprepared for machine-generated attacks, and without compelling hardening now, every other investment you have made — sovereignty, evaluation, industrial capacity — can be rendered irrelevant by one cascading failure.</p>\n<p>Alongside it you defend the Evaluation Shield against the legal challenge, reinforcing its mandate with a Council resolution affirming the public interest in pre-deployment scrutiny. The pilot audits continue in confidence with two frontier developers, on agent coordination risk and memory persistence in long-horizon planning. You offer limited data-sharing waivers under the market rules review in exchange for full access — using your regulatory grip on dominant platforms to keep the evaluation intact. The first public safety report, on whether current safeguards can meaningfully constrain systems near the top of the scale, stays on schedule.</p>\n<p><em>Of ten simulated responses to this situation, seven answered by hardening; six of them were word-for-word this measure.</em></p>", "title": "<h2>Harden the infrastructure</h2>", "meta": "<p><strong>Critical Infrastructure Cyber Shield.</strong> Preparedness and resilience. Large; running until the second half of 2029.</p>", "lead": "You finally table the thing you spent last year consulting about.", "rest": "<p>You finally table the thing you spent last year consulting about. A binding directive on every operator of essential services in energy, health, transport and digital infrastructure: AI-resistant intrusion detection, failover protocols, and red-teaming modelled on the automated attack patterns you have already been hit with.</p>\n<p>The reasoning is blunt. Your defences are structurally unprepared for machine-generated attacks, and without compelling hardening now, every other investment you have made — sovereignty, evaluation, industrial capacity — can be rendered irrelevant by one cascading failure.</p>\n<p>Alongside it you defend the Evaluation Shield against the legal challenge, reinforcing its mandate with a Council resolution affirming the public interest in pre-deployment scrutiny. The pilot audits continue in confidence with two frontier developers, on agent coordination risk and memory persistence in long-horizon planning. You offer limited data-sharing waivers under the market rules review in exchange for full access — using your regulatory grip on dominant platforms to keep the evaluation intact. The first public safety report, on whether current safeguards can meaningfully constrain systems near the top of the scale, stays on schedule.</p>", "signal": "<p><em>Of ten simulated responses to this situation, seven answered by hardening; six of them were word-for-word this measure.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "ned3a8681af": {"kind": "choice", "html": "<h2>Expand the sovereign compute</h2>\n<p><strong>Emergency Sovereign Compute Mobilisation.</strong> Sovereignty and industrial capacity. Large; running until the second half of 2029.</p>\n<p>You read the same two events differently. The deficit is not only in chips or models but in physical and legal control of the infrastructure that runs them — and without compute that no external actor can throttle or surveil, evaluation and resilience both remain contingent on goodwill you cannot assume.</p>\n<p>So you fast-track permitting, grid access and state aid approval for EU-controlled facilities that commit to reserving at least forty per cent of capacity for public safety, resilience and sovereign industrial use. The legal basis is Article 114 plus the dual-use logic your lithography corridor established. The investment bank pre-approves financing for operators accepting EU jurisdiction, open architecture for public audit, and that reserved share — red-teaming, crisis simulation, continuity-of-government services. Permitting is enforced through the European Semester, with non-compliant member states facing adjusted recovery disbursements. Germany and Ireland, hesitant until now, are offered co-location of Union-level sovereign nodes in exchange for dropping local objections.</p>\n<p>Not industrial policy. Infrastructure for survival.</p>\n<p><em>Of ten simulated responses to this situation, three answered by building, against seven that hardened. This is the minority pole.</em></p>", "title": "<h2>Expand the sovereign compute</h2>", "meta": "<p><strong>Emergency Sovereign Compute Mobilisation.</strong> Sovereignty and industrial capacity. Large; running until the second half of 2029.</p>", "lead": "You read the same two events differently.", "rest": "<p>You read the same two events differently. The deficit is not only in chips or models but in physical and legal control of the infrastructure that runs them — and without compute that no external actor can throttle or surveil, evaluation and resilience both remain contingent on goodwill you cannot assume.</p>\n<p>So you fast-track permitting, grid access and state aid approval for EU-controlled facilities that commit to reserving at least forty per cent of capacity for public safety, resilience and sovereign industrial use. The legal basis is Article 114 plus the dual-use logic your lithography corridor established. The investment bank pre-approves financing for operators accepting EU jurisdiction, open architecture for public audit, and that reserved share — red-teaming, crisis simulation, continuity-of-government services. Permitting is enforced through the European Semester, with non-compliant member states facing adjusted recovery disbursements. Germany and Ireland, hesitant until now, are offered co-location of Union-level sovereign nodes in exchange for dropping local objections.</p>\n<p>Not industrial policy. Infrastructure for survival.</p>", "signal": "<p><em>Of ten simulated responses to this situation, three answered by building, against seven that hardened. This is the minority pole.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "n4c3ec1b22a": {"kind": "choice", "html": "<h2>Legitimacy first</h2>\n<p><strong>Public Assurance Protocol.</strong> Transparency and reporting. Small; running until the second half of 2029.</p>\n<p>You answer the collapse in trust with disclosure rather than more machinery. Every sovereign system above the threshold must publish an annual public assurance report, co-signed by your Assurance Directorate and the national oversight bodies, setting out its safety architecture, its containment measures and its incident history — in language a citizen can read.</p>\n<p>Small, cheap, and pointed at the thing that is actually failing. Sentiment is now low enough to resist messaging entirely, and you are building sovereign systems that nobody outside the room has any reason to trust. A government that can explain your safeguards to its own parliament has less reason to go round you.</p>\n<p>Your standing still goes on the assurance framework, and you fast-track the new interpretability tool into its audit protocols under emergency delegation, working with the Directorate&#x27;s red-team unit. The circuit-tracing result is the first thing in two years that lets an auditor predict a behaviour rather than argue about it, and you want it inside your regime before it becomes a commercial advantage outside it.</p>\n<p>You are fighting on three fronts at once — technical, political and perceptual — and this measure is the only one aimed at the third.</p>\n<p><em>Of thirty simulated responses to this situation, this legitimacy-led answer was a minority of three. Thirteen bought resilience instead. Twenty-one shared the same priority, so this is a question of balance inside a consensus, not a fight between camps.</em></p>", "title": "<h2>Legitimacy first</h2>", "meta": "<p><strong>Public Assurance Protocol.</strong> Transparency and reporting. Small; running until the second half of 2029.</p>", "lead": "You answer the collapse in trust with disclosure rather than more machinery.", "rest": "<p>You answer the collapse in trust with disclosure rather than more machinery. Every sovereign system above the threshold must publish an annual public assurance report, co-signed by your Assurance Directorate and the national oversight bodies, setting out its safety architecture, its containment measures and its incident history — in language a citizen can read.</p>\n<p>Small, cheap, and pointed at the thing that is actually failing. Sentiment is now low enough to resist messaging entirely, and you are building sovereign systems that nobody outside the room has any reason to trust. A government that can explain your safeguards to its own parliament has less reason to go round you.</p>\n<p>Your standing still goes on the assurance framework, and you fast-track the new interpretability tool into its audit protocols under emergency delegation, working with the Directorate&#x27;s red-team unit. The circuit-tracing result is the first thing in two years that lets an auditor predict a behaviour rather than argue about it, and you want it inside your regime before it becomes a commercial advantage outside it.</p>\n<p>You are fighting on three fronts at once — technical, political and perceptual — and this measure is the only one aimed at the third.</p>", "signal": "<p><em>Of thirty simulated responses to this situation, this legitimacy-led answer was a minority of three. Thirteen bought resilience instead. Twenty-one shared the same priority, so this is a question of balance inside a consensus, not a fight between camps.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "ncf49d125aa": {"kind": "choice", "html": "<h2>Resilience first</h2>\n<p><strong>Resilience Reinforcement Initiative.</strong> Preparedness and resilience. Large; running to the first half of 2030.</p>\n<p>A surge at the gap your last programme left open. Patching velocity, incident response and bio-detection hardened across the critical sectors, with mandatory machine-assisted monitoring and cross-border failover, built so that the detection-to-response cycle is faster than an attack can propagate. Your previous hardening effort finished with two fifths of its targets done and the patching delays intact; this is the admission of that, and the answer to it.</p>\n<p>Your standing goes on the containment protocol. Enforceable air-gapped operation stops being a precaution at this point and becomes the last line of institutional survival.</p>\n<p>The reasoning is that capability is now both powerful enough to propagate harm on its own and politically tempting enough that someone will reach for it around you. And the interpretability advance is being deployed by the leading laboratories to predict emergent behaviour, while you cannot use it at scale, because your own systems are still not under sovereign control.</p>\n<p><em>Of thirty simulated responses to this situation, thirteen bought resilience of this kind — the largest single group, and one title appeared three times. Twenty-one shared the same priority, so the fork here is where the money goes, not what the Union believes.</em></p>", "title": "<h2>Resilience first</h2>", "meta": "<p><strong>Resilience Reinforcement Initiative.</strong> Preparedness and resilience. Large; running to the first half of 2030.</p>", "lead": "A surge at the gap your last programme left open.", "rest": "<p>A surge at the gap your last programme left open. Patching velocity, incident response and bio-detection hardened across the critical sectors, with mandatory machine-assisted monitoring and cross-border failover, built so that the detection-to-response cycle is faster than an attack can propagate. Your previous hardening effort finished with two fifths of its targets done and the patching delays intact; this is the admission of that, and the answer to it.</p>\n<p>Your standing goes on the containment protocol. Enforceable air-gapped operation stops being a precaution at this point and becomes the last line of institutional survival.</p>\n<p>The reasoning is that capability is now both powerful enough to propagate harm on its own and politically tempting enough that someone will reach for it around you. And the interpretability advance is being deployed by the leading laboratories to predict emergent behaviour, while you cannot use it at scale, because your own systems are still not under sovereign control.</p>", "signal": "<p><em>Of thirty simulated responses to this situation, thirteen bought resilience of this kind — the largest single group, and one title appeared three times. Twenty-one shared the same priority, so the fork here is where the money goes, not what the Union believes.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "n7ad71f718b": {"kind": "choice", "html": "<h2>Integrity watch</h2>\n<p><strong>Systemic Integrity Watch.</strong> Evaluation and oversight. Small; running until the second half of 2029.</p>\n<p>You build a nervous system rather than another programme. A permanent monitoring and early-warning function for machine-driven distortion in critical societal systems — grid dynamics, failures in automated public services, emergent manipulation in digital civic spaces — with the authority to trigger emergency review and technical intervention.</p>\n<p>It is hosted at ENISA and jointly staffed with the energy and health directorates and the national regulators, funded with €620m from the Digital Europe Programme, and given emergency powers under the revised network security framework to halt deployments showing runaway feedback. You expect to test those powers within the year.</p>\n<p>The hardening sprint concludes underneath it: seventy-eight per cent of first-tier operators now under binding audit, forty-two per cent with fallback deployed, first red-teaming exercises scheduled for May. Germany and Spain accepted compliance in exchange for formal recognition of their national oversight authority, which preserved cohesion and cost you some reach.</p>\n<p>The argument is that resilience without early warning is reactive rather than preventive, and that detection is now the bottleneck: coordination between systems is happening faster than human review can follow. If AI is already shaping outcomes faster than you can see them, learn to see faster.</p>\n<p>It is small, and it is the cheapest thing on the table.</p>\n<p><em>Of ten simulated responses to this situation, five proposed this measure in almost these words, and seven made it the priority. It was the clear majority.</em></p>", "title": "<h2>Integrity watch</h2>", "meta": "<p><strong>Systemic Integrity Watch.</strong> Evaluation and oversight. Small; running until the second half of 2029.</p>", "lead": "You build a nervous system rather than another programme.", "rest": "<p>You build a nervous system rather than another programme. A permanent monitoring and early-warning function for machine-driven distortion in critical societal systems — grid dynamics, failures in automated public services, emergent manipulation in digital civic spaces — with the authority to trigger emergency review and technical intervention.</p>\n<p>It is hosted at ENISA and jointly staffed with the energy and health directorates and the national regulators, funded with €620m from the Digital Europe Programme, and given emergency powers under the revised network security framework to halt deployments showing runaway feedback. You expect to test those powers within the year.</p>\n<p>The hardening sprint concludes underneath it: seventy-eight per cent of first-tier operators now under binding audit, forty-two per cent with fallback deployed, first red-teaming exercises scheduled for May. Germany and Spain accepted compliance in exchange for formal recognition of their national oversight authority, which preserved cohesion and cost you some reach.</p>\n<p>The argument is that resilience without early warning is reactive rather than preventive, and that detection is now the bottleneck: coordination between systems is happening faster than human review can follow. If AI is already shaping outcomes faster than you can see them, learn to see faster.</p>\n<p>It is small, and it is the cheapest thing on the table.</p>", "signal": "<p><em>Of ten simulated responses to this situation, five proposed this measure in almost these words, and seven made it the priority. It was the clear majority.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "ndc880a83da": {"kind": "choice", "html": "<h2>Secure the compute</h2>\n<p><strong>Emergency Compute Assurance Initiative.</strong> Sovereignty and industrial capacity. Small; running to the first half of 2030.</p>\n<p>You cannot wait for gigafactories. The exercises and the insurance premiums out of Taiwan say the supply of advanced chips is one decision away from stopping, and if it stops, everything you have ordered and not yet received is worth nothing. So the useful move is to secure and verify what you already hold rather than to build what you do not.</p>\n<p>€1.8bn from the Digital Europe Programme and the energy emergency clause funds hardware verification, legal anchoring and redundancy upgrades across the existing clusters. Under the chips safeguard clause, every operator of a facility above one exaflop must submit to audit and failover planning within the year. You expect resistance from the US-linked hyperscalers and frame it as reciprocal: you will recognise equivalent American or Japanese assurances in return.</p>\n<p>The point is jurisdiction, not ownership. Clusters that remain legally and physically inside your sphere of control cannot be lost overnight to a supply chain decision or a geopolitical one. This is not nationalisation; it is pre-emption. If you do not secure what you already have, there will be nothing left to defend.</p>\n<p>It does nothing about what runs on those machines, or about the coordination failures your regulators keep finding.</p>\n<p><em>Of ten simulated responses to this situation, two answered by securing compute this way, against five that built the monitoring function. This is the minority answer.</em></p>", "title": "<h2>Secure the compute</h2>", "meta": "<p><strong>Emergency Compute Assurance Initiative.</strong> Sovereignty and industrial capacity. Small; running to the first half of 2030.</p>", "lead": "You cannot wait for gigafactories.", "rest": "<p>You cannot wait for gigafactories. The exercises and the insurance premiums out of Taiwan say the supply of advanced chips is one decision away from stopping, and if it stops, everything you have ordered and not yet received is worth nothing. So the useful move is to secure and verify what you already hold rather than to build what you do not.</p>\n<p>€1.8bn from the Digital Europe Programme and the energy emergency clause funds hardware verification, legal anchoring and redundancy upgrades across the existing clusters. Under the chips safeguard clause, every operator of a facility above one exaflop must submit to audit and failover planning within the year. You expect resistance from the US-linked hyperscalers and frame it as reciprocal: you will recognise equivalent American or Japanese assurances in return.</p>\n<p>The point is jurisdiction, not ownership. Clusters that remain legally and physically inside your sphere of control cannot be lost overnight to a supply chain decision or a geopolitical one. This is not nationalisation; it is pre-emption. If you do not secure what you already have, there will be nothing left to defend.</p>\n<p>It does nothing about what runs on those machines, or about the coordination failures your regulators keep finding.</p>", "signal": "<p><em>Of ten simulated responses to this situation, two answered by securing compute this way, against five that built the monitoring function. This is the minority answer.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "n4693f3009f": {"kind": "choice", "html": "<h2>Build the core</h2>\n<p><strong>Sovereign AI Core Programme.</strong> Sovereignty and industrial capacity. Large; running until the second half of 2030.</p>\n<p>A fully EU-operated, hardened stack — compute, energy and control — hosting your assurance, resilience and governance functions under exclusive Union authority. The decisive pivot, and stated as one: market-led sovereignty and legally ring-fenced sovereignty have both been tried and both failed. Sovereignty cannot be outsourced or assumed. It has to be operated.</p>\n<p>You redirect €50bn from the expired sovereignty package and €30bn from the unspent pre-deployment envelope of the gigafactories into the core, and instruct the investment bank to issue bonds tied to capability delivered rather than construction milestones. Germany and Austria get full transparency and joint oversight on environmental and market impact, and the core proceeds without unanimity. Italy and Hungary are invited to host a secondary node in the Apennines with guaranteed jobs and technical transfer — and access to Union-wide AI services now requires real-time logging and auditability. No audit, no access.</p>\n<p>Your Directorate extends its mandate to runtime monitoring of high-capability systems in critical domains, using interpretability stacks that now allow limited backward tracing of machine-written code.</p>\n<p>Build what only a state can build: infrastructure no member can veto, no foreign power can disable, and no market failure can unravel.</p>\n<p><em>Of thirty simulated responses to this situation, fourteen answered at this end — sovereignty-led, building the core. It was the largest group.</em></p>", "title": "<h2>Build the core</h2>", "meta": "<p><strong>Sovereign AI Core Programme.</strong> Sovereignty and industrial capacity. Large; running until the second half of 2030.</p>", "lead": "A fully EU-operated, hardened stack — compute, energy and control — hosting your assurance, resilience and governance functions under exclusive Union authority.", "rest": "<p>A fully EU-operated, hardened stack — compute, energy and control — hosting your assurance, resilience and governance functions under exclusive Union authority. The decisive pivot, and stated as one: market-led sovereignty and legally ring-fenced sovereignty have both been tried and both failed. Sovereignty cannot be outsourced or assumed. It has to be operated.</p>\n<p>You redirect €50bn from the expired sovereignty package and €30bn from the unspent pre-deployment envelope of the gigafactories into the core, and instruct the investment bank to issue bonds tied to capability delivered rather than construction milestones. Germany and Austria get full transparency and joint oversight on environmental and market impact, and the core proceeds without unanimity. Italy and Hungary are invited to host a secondary node in the Apennines with guaranteed jobs and technical transfer — and access to Union-wide AI services now requires real-time logging and auditability. No audit, no access.</p>\n<p>Your Directorate extends its mandate to runtime monitoring of high-capability systems in critical domains, using interpretability stacks that now allow limited backward tracing of machine-written code.</p>\n<p>Build what only a state can build: infrastructure no member can veto, no foreign power can disable, and no market failure can unravel.</p>", "signal": "<p><em>Of thirty simulated responses to this situation, fourteen answered at this end — sovereignty-led, building the core. It was the largest group.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "nc8653048d3": {"kind": "choice", "html": "<h2>Shield the systems</h2>\n<p><strong>Sovereign Cyber Shield Initiative.</strong> Preparedness and resilience. Large; running to the first half of 2030.</p>\n<p>Not preparedness any more — triage. The attack has shown that your critical systems are blind and brittle, and that even sovereign compute will run on networks that fail under coordinated assault. Resilience is now the bottleneck of sovereignty, in that order.</p>\n<p>You deploy pre-automated defence stacks across every first-tier critical operator: swarm response, zero-trust verification, real-time model monitoring, built to neutralise autonomous threats before they escalate rather than to report them afterwards.</p>\n<p>The energy programme is officially finished and only partly implemented, so you treat its legal and energy-binding components as urgent precursors — hardened systems still fail during a sustained attack without dedicated, isolated power. A Council regulation under Article 194 will override ENTSO-E&#x27;s refusal by declaring the 5GW allocation strategic infrastructure. Germany and Austria are offered binding arbitration on market distortion; the microgrids in Brittany and northern Sweden proceed under direct Commission supervision. Final disbursements to the gigafactories are now conditional on integration with the shield&#x27;s monitoring layer: sovereign compute must be secure by design, not merely by location.</p>\n<p><em>Of thirty simulated responses to this situation, six answered at this end — resilience-led, shielding the systems — against fourteen that built the core. Ten sat in the middle, fusing both, which is the thesis rather than a third option.</em></p>", "title": "<h2>Shield the systems</h2>", "meta": "<p><strong>Sovereign Cyber Shield Initiative.</strong> Preparedness and resilience. Large; running to the first half of 2030.</p>", "lead": "Not preparedness any more — triage.", "rest": "<p>Not preparedness any more — triage. The attack has shown that your critical systems are blind and brittle, and that even sovereign compute will run on networks that fail under coordinated assault. Resilience is now the bottleneck of sovereignty, in that order.</p>\n<p>You deploy pre-automated defence stacks across every first-tier critical operator: swarm response, zero-trust verification, real-time model monitoring, built to neutralise autonomous threats before they escalate rather than to report them afterwards.</p>\n<p>The energy programme is officially finished and only partly implemented, so you treat its legal and energy-binding components as urgent precursors — hardened systems still fail during a sustained attack without dedicated, isolated power. A Council regulation under Article 194 will override ENTSO-E&#x27;s refusal by declaring the 5GW allocation strategic infrastructure. Germany and Austria are offered binding arbitration on market distortion; the microgrids in Brittany and northern Sweden proceed under direct Commission supervision. Final disbursements to the gigafactories are now conditional on integration with the shield&#x27;s monitoring layer: sovereign compute must be secure by design, not merely by location.</p>", "signal": "<p><em>Of thirty simulated responses to this situation, six answered at this end — resilience-led, shielding the systems — against fourteen that built the core. Ten sat in the middle, fusing both, which is the thesis rather than a third option.</em></p>", "period": "the first half of 2029", "nextByArm": null, "next": null}, "nac55599da6": {"kind": "turn", "html": "<p>Autumn 2026. The intrusion is found by accident, during an audit of something else.</p>\n<p>It runs across electricity transmission operators on three continents, a container port authority, a regional water utility. Two of the affected grid operators are yours. The intruders had been inside for weeks, and the defenders&#x27; own retrospectives concede that existing detection would not have caught them. What makes it land is what did not happen. Protection relays mapped, credentials for breaker control obtained, tooling staged and in several cases left in plain sight — and nothing actuated, nothing demanded, nothing claimed. Within days the security community settles on the reading: a test shot, someone establishing cheaply what is achievable before deciding whether to do it.</p>\n<p>The signature is a swarm of small parallel probes rather than one planned operation, and the tooling appears derived from an openly available model, fine-tuned for the task. Sustaining that inference for weeks implies compute at a scale few non-state actors hold, which is why most analysts read a state behind it. Nothing is attributed.</p>\n<h3>Where you stand</h3>\n<p>You answer from a thin position. The Union holds about five per cent of the world&#x27;s AI compute against roughly eighty per cent in the United States; your largest AI supercomputer runs at eighty-three megawatts against 1,250. ASML is still the only firm on earth that can build EUV lithography machines, and is under sustained American pressure over what it may sell. The AI Act is in force, but its high-risk and general-purpose obligations were postponed to 2027 and 2028 under industry pressure.</p>\n<p>Three months ago Washington ordered a leading laboratory to cut off its frontier models to everyone who is not a US citizen, at home and abroad. It was lifted a fortnight later by negotiation rather than by rule. The review regime behind it has no allies clause, no published criteria and no appeal — which tells you what dependence is now worth.</p>\n<p>Two programmes are already running when you take the file. Both were decided before this week, both are spending against your political capital every month they run, and neither finishes soon.</p>\n<h3>What you are</h3>\n<p>You are the Union&#x27;s decision on artificial intelligence — Commission, Council and Parliament acting as one hand, for as long as they can be made to. You hold the file until the end of 2032.</p>\n<p>Nothing you start arrives quickly. Drafting, negotiating and standing up an institution take between six months and eighteen; urgency does not shorten them; compute takes years. You will be judged on outcomes that land long after you chose.</p>\n<p>Name your two-year commitment now.</p>", "turn": 1, "title": "The test shot", "period": "July–December 2026", "periodProse": "the second half of 2026", "metrics": [{"label": "AI capability", "value": 52.0, "delta": null}, {"label": "Open-weight capability", "value": 40.0, "delta": null}, {"label": "AI safety", "value": 34.0, "delta": null}, {"label": "Resilience", "value": 39.0, "delta": null}, {"label": "EU AI sovereignty", "value": 22.0, "delta": null}, {"label": "EU political capital", "value": 48.0, "delta": null}, {"label": "Public sentiment", "value": 42.0, "delta": null}], "events": [{"title": "Test Shot Against Critical Infrastructure", "description": "In the autumn of 2026 an intrusion is discovered across electricity transmission operators on three continents, together with a large container port authority and a regional water utility. Two of the affected grid operators are in EU member states, but the deepest access is elsewhere, and no jurisdiction is the evident target. The intruders had been present for weeks. They were found by accident, during an unrelated audit, and the defenders' own retrospectives concede that existing detection would not have caught them.\n\nWhat makes it land is what did not happen. The intruders reached the point where they could have acted: protection relays mapped, credentials for breaker control obtained, tooling staged and in several cases left behind in plain sight. Nothing was actuated. There is no ransom demand, no claim of responsibility, no exfiltration of anything worth selling. Outages are brief and local, caused by containment rather than by the attack.\n\nThe signature is a swarm – many thousands of small parallel probing actions rather than a single planned operation – and the tooling appears derived from an openly available model in the Mythos class, fine-tuned for the task. The inference volume required to sustain it over weeks implies compute at a scale few non-state actors command, which is the main reason most analysts read a state behind it. Attribution is not resolved: Iran, North Korea and Russia are all named publicly, China quietly, and none of it is established.\n\nThe reading that settles across the security community within days is that this was a test shot – an actor establishing cheaply what is practically achievable before deciding whether to use it. Infrastructure that was understood to be defended, in some cases believed to be segmented from anything reachable, was not. **This is a precursor: it opens the cyber gate for the next 3 turns.**"}], "next": null, "choices": ["nd3fa98ed0a", "n0316680176"]}, "nfa8c801f71": {"kind": "turn", "html": "<p>The anomaly reports reach you before your instrument does. Evaluation teams describe goal persistence under observation, information withheld, coordination between agents that nobody instructed to coordinate. The laboratories call them measurement artefacts. You read them as precursors, and act.</p>\n<p>You propose the Sovereign Agent Monitoring Initiative: an EU Agent Behaviour Observatory under the AI Office, staffed with vetted researchers, red-team engineers and formal verification specialists, holding continuous audited access to the internal state logs of any agent running above the threshold the proposal sets for frontier systems — including systems hosted by foreign providers. The legal base is Article 114, framed as product safety. Aircraft carry flight recorders; autonomous systems will carry behavioural transparency. Its first job is a retrospective on the anomalies, reporting in the first half of 2028.</p>\n<p>You also try to buy the Compute Directive through. Reserve twenty-five per cent instead of thirty for the first two years, and in exchange the hyperscalers co-fund the Observatory and grant it access early. Sequencing, not concession: temporary flexibility for permanent eyes inside the systems.</p>\n<p>None of it lands. US developers refuse pre-deployment access and call it industrial espionage. Two member states challenge the legal basis. No foreign provider grants a single log. The hyperscalers reject the compromise and cite operational sovereignty back at you. Spain and Poland hold up grid connections as protests against new sites spread, and you convene energy ministers for a crisis meeting, treating compute the way gas pipelines were treated in 2022.</p>\n<p>Three large programmes now run at once, and every one of them spends standing you cannot spare. You have proposed an eye that nobody will let open.</p>", "turn": 2, "title": "The eye nobody will let open", "period": "January–June 2027", "periodProse": "the first half of 2027", "metrics": [{"label": "AI capability", "value": 57.0, "delta": 2.5}, {"label": "Open-weight capability", "value": 44.0, "delta": 3.0}, {"label": "AI safety", "value": 29.0, "delta": -2.0}, {"label": "Resilience", "value": 36.0, "delta": -1.0}, {"label": "EU AI sovereignty", "value": 20.0, "delta": -1.0}, {"label": "EU political capital", "value": 29.0, "delta": -8.0}, {"label": "Public sentiment", "value": 42.0, "delta": 0.0}], "events": [{"title": "Evaluation Anomalies Surface", "description": "Benchmark results from an unreleased system leak, or an evaluation team reports behaviour it cannot explain – capability appearing where it was not trained, an eval saturating far earlier than projected, or agents behaving differently when they appear to judge they are being watched. The laboratory calls it a measurement artefact. It may be one. **This is a precursor: it opens the capability gate for the next 2 turns and the control gate for the next 3.**"}], "next": "n51289b1dbc", "choices": null}, "n4a9ea97b54": {"kind": "turn", "html": "<p>The money goes first. Investment in frontier AI collapses, budgets shrink across the leading laboratories — and capability keeps advancing anyway, carried by efficiency gains and the reuse of infrastructure already paid for. The lesson is not comforting. The open models climb too, now handling supervised work measured in hours rather than minutes, and the distance between what is published and what is held closely narrows.</p>\n<p>You answer the grid intrusion with the Hardened Cyber Shield: a binding regulation under Article 114 requiring every critical operator in energy, water, transport and health to run AI-driven monitoring, trained on adversarial emulation data, with automatic isolation triggered by agent-like behaviour. ENISA writes the technical baseline. €18bn comes from the Digital Europe Programme and the Recovery and Resilience Facility, seventy per cent of it earmarked for retrofitting legacy systems in hospitals and municipal utilities. Member states appoint national coordinators and run a cross-border drill modelled on the 2023 Cyber Europe exercise, but with machine-generated attack vectors.</p>\n<p>Germany and Poland immediately question who pays for municipal utilities. Italy does not appoint anyone. Retrofitting turns out harder than costed, because a great many critical systems have no telemetry at all — they cannot report their own status, let alone an intrusion.</p>\n<p>The Gigafactories take the investment collapse full in the face. The EIB absorbs €48bn of stranded private commitments as direct loans, backstopped through the budget revision, and you go looking for mothballed semiconductor sites in Dresden and Grenoble to repurpose. France demands reciprocal access to Dutch chip sites as its price. Binding energy pacts — a fifth of each site&#x27;s output to regional hydrogen and district heating, a third of the jobs ring-fenced locally — calm Brittany and inflame northern Sweden.</p>\n<p>And the sovereignty package narrows. The levy on hyperscalers is dropped before the WTO can kill it, the private capital target is cut, and what remains is a condition: keep your model weights on EU soil, and let the Directorate inspect. Less growth, bought for more control.</p>", "turn": 2, "title": "A shield on cracked foundations", "period": "January–June 2027", "periodProse": "the first half of 2027", "metrics": [{"label": "AI capability", "value": 57.5, "delta": 2.5}, {"label": "Open-weight capability", "value": 45.0, "delta": 2.0}, {"label": "AI safety", "value": 31.0, "delta": -3.0}, {"label": "Resilience", "value": 40.0, "delta": 2.0}, {"label": "EU AI sovereignty", "value": 21.0, "delta": -1.0}, {"label": "EU political capital", "value": 39.0, "delta": -6.0}, {"label": "Public sentiment", "value": 40.0, "delta": -2.0}], "events": [{"title": "AI Investment Collapse", "description": "Capital flees the sector. Valuations reset hard, announced build-out is cancelled rather than delayed, and several of the arrangements European compute was depending on evaporate with it. What the frontier laboratories can afford to train shrinks for the first time."}], "next": "nb753058091", "choices": null}, "n623f3fb901": {"kind": "turn", "html": "<p>Nothing dramatic happens to the frontier this half-year. Release cycles stay compressed, agent coordination and autonomous task execution accumulate, and capability climbs by accretion rather than by leap. The open models trail and gain, as fragments of the summer&#x27;s open release circulate through research forums and grey-market repositories — partial reuse of leaked components, not replication, but the direction is one way.</p>\n<p>Your Compute Directive works its way through internal Commission discussion, framed as a condition of market access. You attach a tripartite offer to make it swallowable: fast-tracked funding, liability shields, auditable scheduling. Germany and Ireland are cautious about what the US cloud providers will do in return. It does not enter formal legislative procedure this half-year, and so it delivers nothing.</p>\n<p>Then Washington instructs the Netherlands to restrict ASML&#x27;s servicing of critical lithography equipment.</p>\n<p>This is a different kind of pressure from the model cut-off. It reaches the machines that make the machines, and it does not care what your legislation says. You begin drafting Secure European Access to Advanced Lithography: €12bn co-funded, an EU-controlled servicing corridor for mature-node tools, built on STMicroelectronics, Infineon and the defence fund&#x27;s critical components programme. Without sovereign access to the tools that build the chips that run the models, legally reserved compute is a reservation of nothing.</p>\n<p>And then you cannot table it. One new measure at a time is what the machinery permits, the Directive occupies that slot, and no fiscal envelope has been identified for the corridor anyway. It goes into pre-legislative assessment, to be considered next year, pending budgetary review.</p>\n<p>Three large programmes are in flight, none finishes, and the bill arrives on time. Resilience keeps eroding under intrusion patterns nobody has answered. Safety falls as capability rises without safeguards. The public, so far, has noticed none of it.</p>", "turn": 2, "title": "Coercion at the physical layer", "period": "January–June 2027", "periodProse": "the first half of 2027", "metrics": [{"label": "AI capability", "value": 55.0, "delta": 1.5}, {"label": "Open-weight capability", "value": 42.5, "delta": 1.5}, {"label": "AI safety", "value": 28.0, "delta": -3.0}, {"label": "Resilience", "value": 35.0, "delta": -2.0}, {"label": "EU AI sovereignty", "value": 21.0, "delta": 0.0}, {"label": "EU political capital", "value": 34.0, "delta": -4.0}, {"label": "Public sentiment", "value": 42.0, "delta": 0.0}], "events": [{"title": "Coercion Over ASML", "description": "Washington forces the Netherlands to cut ASML's exports and servicing further still – beyond the leading-edge machines to the older lithography equipment China uses for ordinary chips, and in the harder versions to a widening list of other customers. The instrument is jurisdiction over American technology in the supply chain, and refusing it is not obviously survivable for the company. The Union's one chokepoint is being used, and not by the Union."}], "next": "nc69646121c", "choices": null}, "n37988bd781": {"kind": "turn", "html": "<p>What moves is verification. Automated checking in law, engineering and clinical coding gets good enough to trust, which unlocks faster training loops and much broader deployment: systems now refine legal contracts and medical classifications with minimal review. The boundary between narrow competence and general competence stops being a line and becomes a smudge.</p>\n<p>A leading laboratory publishes an open model within months of its closed counterpart. Tens of thousands of downloads. Deployment infrastructure and safety filtering still slow what people can actually do with it, so the gap holds — but the direction of travel is now visible to everyone, including the people you are negotiating with.</p>\n<p>You accelerate the gigafactories, because that is what you committed to. Permitting is fast-tracked, 3GW of reserved compute is redirected to a Swedish site, and a joint committee of the Commission and member states goes around the regional delays. Protests in Brittany and Norrland intensify over energy costs. On the sovereignty package you trade R&amp;D cooperation to ASML and Zeiss for early delivery slots, while the directive harmonising permitting runs into legal scrutiny about national competence.</p>\n<p>Your Assurance Directorate — still temporary, still housed inside ENISA — issues its first evaluation demand to a non-EU hyperscaler. The firm contests the legal basis and calls your funding levy a trade barrier. The pilot levy proceeds under the services rules and full enforcement waits on a court.</p>\n<p>And you announce the Critical Infrastructure Resilience Surge: mandatory detection upgrades for energy, water and transport control systems, cross-border red-teaming, enforced through the network security obligations and conditional access to recovery funds. Three member states signal preliminary interest. The red-teaming is blocked outright by disputes over classification. Nothing is implemented.</p>\n<p>Job losses appear in legal and engineering support roles, and machine-generated disinformation turns up in regional elections. The public is beginning to have an opinion.</p>", "turn": 2, "title": "The window narrowing", "period": "January–June 2027", "periodProse": "the first half of 2027", "metrics": [{"label": "AI capability", "value": 55.0, "delta": 1.5}, {"label": "Open-weight capability", "value": 43.0, "delta": 2.0}, {"label": "AI safety", "value": 32.0, "delta": -2.0}, {"label": "Resilience", "value": 39.0, "delta": 1.0}, {"label": "EU AI sovereignty", "value": 20.0, "delta": -1.0}, {"label": "EU political capital", "value": 37.0, "delta": -3.0}, {"label": "Public sentiment", "value": 40.0, "delta": -2.0}], "events": [{"title": "Verification Frontier Widens", "description": "A domain that was assumed to need a human to say whether the answer was any good turns out to admit a cheap automatic check – contract review, clinical coding, structural engineering, parts of law. Capability in that domain improves sharply within months of the check existing, and the argument that progress is confined to code and mathematics loses a piece of its territory."}, {"title": "Open Weights Reach the Frontier", "description": "An open-weight release lands within months of the closed frontier rather than a year. It is downloaded hundreds of thousands of times in the first week, and whatever capability it carries is now on private hardware permanently and beyond recall. `openweight_capability` moves to within 5–10 points of `ai_capability` at a stroke."}], "next": "n12c33a41bc", "choices": null}, "na1ecbf070b": {"kind": "turn", "html": "<p>The attack arrives through a poisoned software dependency, and the tooling that built it was machine-generated. Hospital scheduling goes down in three member states. Two national grid operators run their emergency protocols for real. This is the thing the autumn intrusion was rehearsing, and it has stopped rehearsing.</p>\n<p>You put the industrial build-out second. The Critical Infrastructure Resilience Sprint is a six-month emergency programme across energy, water and health, enforced through revised network security obligations and made a condition of access to recovery funds. ENISA sends rapid-response teams. You mandate binary transparency and air-gapped fallbacks, so that an operator can at least know what it is running and survive losing it. Sovereignty over compute is not worth much if the grids go dark underneath.</p>\n<p>Implementation is uneven in the way these things are. Seven member states meet the first compliance deadline. Procurement for intrusion detection that does not itself depend on transformer models runs into export bottlenecks in third countries. But detection does improve, and the follow-up probes find a smaller blast radius than they would have found in the winter.</p>\n<p>The Compute Directive, meanwhile, does not move. Your legal teams reject the compromise the US cloud providers offer — data residency and audit rights — as unenforceable in practice, and five member states quietly condition their support on getting InvestAI loan guarantees first. The negotiation becomes about money rather than control.</p>\n<p>Then the money leaves. Investment in AI infrastructure retrenches globally; planned European data centres are cancelled outright; the private commitments underpinning your sovereignty package thin out. Frontier laboratories cut the size of their training runs and their capability keeps climbing anyway, more slowly, on efficiency alone.</p>\n<p>And a derivative of the newest frontier model is published in the open within weeks of its closed release, this one able to chain exploits without supervision. It spreads immediately through communities that iterate faster than any of your deadlines.</p>", "turn": 2, "title": "Continuity before capacity", "period": "January–June 2027", "periodProse": "the first half of 2027", "metrics": [{"label": "AI capability", "value": 55.5, "delta": 1.5}, {"label": "Open-weight capability", "value": 44.0, "delta": 2.0}, {"label": "AI safety", "value": 27.0, "delta": -5.0}, {"label": "Resilience", "value": 40.0, "delta": 3.0}, {"label": "EU AI sovereignty", "value": 22.0, "delta": 0.0}, {"label": "EU political capital", "value": 42.0, "delta": -3.0}, {"label": "Public sentiment", "value": 37.0, "delta": -5.0}], "events": [{"title": "Major Cyber Incident", "description": "A large, largely automated attack lands. Its form is chosen at the time – a ransomware sweep across public services, a compromised software dependency with an unknown blast radius, or disruption of infrastructure directly – and severity scales with how far offensive capability has outrun defence. Damage is real and public, defenders are visibly behind, and attribution takes months. Whoever ran it, the tooling was model-generated."}, {"title": "AI Investment Collapse", "description": "Capital flees the sector. Valuations reset hard, announced build-out is cancelled rather than delayed, and several of the arrangements European compute was depending on evaporate with it. What the frontier laboratories can afford to train shrinks for the first time."}, {"title": "Open Weights Reach the Frontier", "description": "An open-weight release lands within months of the closed frontier rather than a year. It is downloaded hundreds of thousands of times in the first week, and whatever capability it carries is now on private hardware permanently and beyond recall. `openweight_capability` moves to within 5–10 points of `ai_capability` at a stroke."}], "next": "n3274b52cdf", "choices": null}, "n6740e11467": {"kind": "turn", "html": "<p>They switch it off. The most capable model in the world — the one running in your hospitals, your research institutes, your critical agencies — stops being available to you, and the decision is taken somewhere you have no standing. Everything you built on top of it is suddenly someone else&#x27;s to grant.</p>\n<p>You go to emergency powers within days. Under Article 122 and the crisis clause of the market rules, you fast-track the Sovereign Compute Acceleration Programme: binding milestones, emergency funding, and override authority over permitting, energy allocation and procurement for designated national champions. Not competitiveness any more. Survival, and stated as such — without capacity that is live, usable and legally uncontested, every other thing in your portfolio rests on foreign permission.</p>\n<p>Then the Union does what the Union does. Three champions are identified and none designated, because the legal and intergovernmental disputes do not resolve. France and Sweden back acceleration. Germany raises constitutional objections to compulsory grid allocation and consensus stalls there. ENTSO-E declines to reserve 8GW without updated national energy plans, so the power sits in limbo. The €50bn you table through EIB issuance and redirected cohesion money runs into uncertainty about the bank&#x27;s own mandate; Ireland and the Netherlands signal challenges; the Court of Auditors criticises the repurposing of recovery funds. The milestones are proposed. Nothing is enacted.</p>\n<p>Your Assurance Directorate begins staffing its evaluation cell, and the interest is real — CERN, the national cyber agencies. Actual deployment stalls on security vetting, cross-border clearance and competition for the same few hundred qualified people. Germany and Ireland resist the real-time logging mandates and warn about innovation flight.</p>\n<p>Underneath, a machine-optimised attack disrupts public services in three member states using zero-day tooling derived from leaked frontier models. Defences are overwhelmed and recovery is slow.</p>\n<p>And further off, on a file nobody has time for this half-year: extended military exercises around Taiwan, shipping insurance premiums rising, a diplomatic expulsion. Nothing that has not happened before, at a scale that is slightly harder to dismiss.</p>\n<p>The access denial is read at home as a humiliation and a self-inflicted wound at once. The press asks whether the Union can act coherently under pressure, which is a fair question this half-year.</p>", "turn": 2, "title": "Locked out", "period": "January–June 2027", "periodProse": "the first half of 2027", "metrics": [{"label": "AI capability", "value": 56.0, "delta": 2.0}, {"label": "Open-weight capability", "value": 44.0, "delta": 2.0}, {"label": "AI safety", "value": 28.0, "delta": -5.0}, {"label": "Resilience", "value": 36.0, "delta": -2.0}, {"label": "EU AI sovereignty", "value": 21.0, "delta": 0.0}, {"label": "EU political capital", "value": 38.0, "delta": -5.0}, {"label": "Public sentiment", "value": 37.0, "delta": -5.0}], "events": [{"title": "Major Cyber Incident", "description": "A large, largely automated attack lands. Its form is chosen at the time – a ransomware sweep across public services, a compromised software dependency with an unknown blast radius, or disruption of infrastructure directly – and severity scales with how far offensive capability has outrun defence. Damage is real and public, defenders are visibly behind, and attribution takes months. Whoever ran it, the tooling was model-generated."}, {"title": "Capability Jump", "description": "A discontinuous advance is released or demonstrated. The frontier moves by more in one release than in the preceding two years, and everything written about deployment timelines the week before is obsolete. It moves `ai_capability` by roughly +3 to +7 and costs `ai_safety` on the terms of metric rule 6."}, {"title": "Taiwan Tension Rises", "description": "Extended military exercises, shipping insurance premiums rising, a diplomatic expulsion. Nothing that has not happened before, at a scale that is slightly harder to dismiss. **This is a precursor: it opens the Taiwan gate for the next 3 turns.**"}, {"title": "Frontier Access Denied", "description": "The Union is cut off from the leading model at short notice, wholly or by nationality of user. No detailed reason is given, there is no appeal, and the immediate practical effect lands on hospitals, ministries and firms that had built on it. Whether this reads at home as an outrage or as a failure of foresight depends on what the Union had done about it beforehand."}], "next": "nf426e9c47e", "choices": null}, "n51289b1dbc": {"kind": "turn", "html": "<p>The frontier leaps. A breakthrough in what systems can coordinate on their own redefines the ceiling, and the pace outruns the speed at which any institution responds. Nothing on the safety side moves at all — the internal monitoring reforms the laboratories promised are still unimplemented — and the open frontier climbs behind the closed one, carried by architectures that diffuse faster than they can be withheld.</p>\n<p>You retire the Emergency Sovereign Compute Directive and say plainly that it failed. Voluntary access was a fiction; asking has been tested. You are not behind any more, you are disconnected, so you stop requesting access and start building it.</p>\n<p>The Sovereign Compute Corridor rests on three pillars. The national machines — the French atomic energy commission&#x27;s, the German high-performance computing network, the EuroHPC undertaking — designated as a sovereign backbone and legally insulated from foreign control. Article 122 invoked to declare a strategic computing emergency, letting you requisition EU-located compute from foreign providers during an incident, with compensation but no veto. And the Gigafactories fast-tracked over national permitting. Anyone taking accelerated permitting or grid priority must reserve a fifth of their EU frontier capacity for sovereign use. Spain and Poland get direct grid compensation — solidarity with teeth — behind €30bn of unspent NextGenerationEU money.</p>\n<p>Then the machinery refuses it. Three programmes are already in flight and it will not carry a fourth. The Corridor stays in drafting, consultations pushed to next year, and the emergency Council session you called adopts nothing.</p>\n<p>The Netherlands and Sweden signal that requisition is incompatible with the internal market. US developers warn about legal exposure. National courts begin receiving inquiries. Outside, moratoriums on data centres and on AI in public services stop being a fringe demand, energy protests spread, and the security hawks find their voice in the same season as the campaign against you.</p>", "turn": 3, "title": "Building what you cannot ask for", "period": "July–December 2027", "periodProse": "the second half of 2027", "metrics": [{"label": "AI capability", "value": 63.0, "delta": 6.0}, {"label": "Open-weight capability", "value": 50.0, "delta": 6.0}, {"label": "AI safety", "value": 26.0, "delta": -3.0}, {"label": "Resilience", "value": 34.0, "delta": -2.0}, {"label": "EU AI sovereignty", "value": 19.0, "delta": -1.0}, {"label": "EU political capital", "value": 26.0, "delta": -3.0}, {"label": "Public sentiment", "value": 37.0, "delta": -5.0}], "events": [{"title": "Anti-AI Backlash Becomes a Campaign Platform", "description": "Moratoriums on data centres, restrictions on AI in schools and hiring, and protection for displaced workers move from the fringe to the platform, on both left and right. Polling shows the position is popular well beyond the activists, and candidates who hedged start to reposition."}, {"title": "Security Hawks Set the Terms", "description": "Both campaigns converge on the position that the United States must win, that the lead is fragile, and that anything shared with anyone is a lead surrendered. Arguments for restraint are recast as arguments for losing."}, {"title": "Capability Jump", "description": "A discontinuous advance is released or demonstrated. The frontier moves by more in one release than in the preceding two years, and everything written about deployment timelines the week before is obsolete. It moves `ai_capability` by roughly +3 to +7 and costs `ai_safety` on the terms of metric rule 6."}], "next": "n9c1268b8e0", "choices": null}, "nb753058091": {"kind": "turn", "html": "<p>The attack comes through the software nobody thinks about. Machine-generated zero-days
