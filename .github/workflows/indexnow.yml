name: IndexNow

# Pingar Bing m.fl. (IndexNow) med ändrade sidor efter att GitHub Pages hunnit deploya.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vänta på Pages-deploy
        run: sleep 90
      - run: python3 .github/indexnow.py
        env:
          INDEXNOW_KEY: abc47b1927356fb8aed4dce535bce150
          BEFORE_SHA: ${{ github.event.before }}
